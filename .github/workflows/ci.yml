name: smalltalkCI

on: 
  push:
  pull_request:
    branches:
      gemstone
  schedule:
    - cron: "15 2 14 * *" #run job on the 14th day of every month on the 15th minute of the 2nd hour

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-latest, macos-latest ]
        smalltalk: [ GemStone64-3.7.1, GemStone64-3.6.8, GemStone64-3.5.8 ]
        exclude: 
          - smalltalk: GemStone64-3.5.8
            os: macos-latest
        include: 
          - smalltalk: GemStone64-3.5.8
            os: macos-12
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Run tests
        run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 20
  slack-workflow-status:
    if: always()
    name: Post Workflow Status To Slack
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
       - name: Slack Workflow Notification
         uses: Gamesight/slack-workflow-status@master
         with:
          repo_token: ${{secrets.GITHUB_TOKEN}}
          slack_webhook_url: ${{secrets.SLACK_DALEHENRICH}}
          name: 'action run' 
